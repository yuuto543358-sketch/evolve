<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>EVOLVE</title>
  <meta name="description" content="EVOLVE（イボルブ）— 昨日の自分を、少しずつ超えていく。身体づくり総合管理アプリ">
  <meta name="theme-color" content="#F7F8F6">
  <meta name="color-scheme" content="light">

  <!-- ホーム画面に追加したとき、アプリのように表示するための設定 -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="EVOLVE">
  <meta name="application-name" content="EVOLVE">
  <meta name="format-detection" content="telephone=no">

  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png">
  <link rel="icon" type="image/svg+xml" href="./icons/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png">

  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <div id="app">
    <div id="demo-banner" hidden>デモデータを表示中です（あなたの記録とは別に保存されています）<button type="button" id="demo-exit">デモを終了</button></div>
    <main id="view" aria-live="polite">
      <div class="boot">
        <img src="./icons/logo-mark.svg" alt="" width="64" height="64">
        <p>EVOLVE</p>
      </div>
    </main>
    <nav id="tabbar" hidden aria-label="メインメニュー"></nav>
  </div>
  <div id="overlay-root"></div>
  <noscript><p style="padding:24px">EVOLVEを使うにはJavaScriptを有効にしてください。</p></noscript>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
